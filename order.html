
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Bites | Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js" defer></script>
</head>
<body>

<header>
    <h1>FRESH BITES</h1>
    <p>Your order, your way!</p>
</header>

<nav>
    <a href="index.html">HOME</a>
    <a href="menu.html">MENU</a>
    <a href="order.html">ORDER</a>
</nav>

<section class="order-section">

    <h2>🛒 Your Shopping Cart</h2>

    <div id="cart-items">
        <p>Your cart is empty.</p>
    </div>

    <div class="total-box">
        <h2>Grand Total: P<span id="checkout-total">0.00</span></h2>
    </div>

    <hr>

    <h2>Customer Details</h2>

    <form onsubmit="sendOrder(event)">

        <label>Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your name" required>

        <label>Your Contact Number</label>
        <input type="tel" id="phone"
               placeholder="Enter your phone number" required>

        <label>Delivery Address / Collection</label>
        <input type="text" id="address"
               placeholder="Enter delivery address or collection" required>

        <label>Additional Instructions</label>
        <textarea id="notes"
                  placeholder="Any special requests?"></textarea>

        <button type="submit" class="btn">
            CONFIRM ORDER ON WHATSAPP
        </button>

    </form>

    <a href="https://wa.me/26778440318"
       class="whatsapp-btn"
       target="_blank">
       CHAT WITH US ON WHATSAPP
    </a>

    <a href="menu.html" class="back-link">
        ← Continue Shopping
    </a>

</section>

<footer>
    <p>© 2026 Fresh Bites</p>
</footer>

<script>

function sendOrder(event) {

    event.preventDefault();

    if (cart.length === 0) {
        alert("Your cart is empty. Please add meals first.");
        return;
    }

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;
    const notes = document.getElementById("notes").value;

    let message = "HELLO FRESH BITES! 🍔\n";
    message += "I would like to place an order.\n\n";

    message += "CUSTOMER DETAILS\n";
    message += "Name: " + name + "\n";
    message += "Phone: " + phone + "\n";
    message += "Address/Collection: " + address + "\n\n";

    message += "MY ORDER\n";

    cart.forEach(item => {
        message += item.name +
            " x " + item.quantity +
            " = P" + (item.price * item.quantity).toFixed(2) + "\n";
    });

    message += "\nGRAND TOTAL: P" +
        getCartTotal().toFixed(2);

    message += "\n\nAdditional instructions: " + notes;

    const whatsappURL =
        "https://wa.me/26778440318?text=" +
        encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
}

</script>

</body>
</html>
